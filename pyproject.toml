[project]
name = "python-template"
version = "0.1.0"
description = "Template for my personal projects"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
    "ty>=0.0.69",
]

[tool.ruff]
output-format = "concise"
line-length = 100
indent-width = 4
exclude = [".git", "docs/conf.py", "autogenerated"]
respect-gitignore = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D", "TD002", "FIX002", "PT012", "FA100", "ANN003", 
    "C408", "ANN002", "TD003", "EM101", "EM102",
    # ignore rules that are conflicting to the Ruff formatter as described in its docs:
    # https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191", "E111", "E114", "E117", "D203", "D206", "D300", "Q000", "Q001",
    "Q002", "Q003", "Q004", "COM812", "COM819"
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "SLF", "ANN", "ARG", "FBT001", "PLR2004", "CPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty]